name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 12 exige PHP 8.3 : inutile de tester en dessous.
        php-version: ["8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Mettre en cache les dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Vérifier composer.json et composer.lock
        run: composer validate --strict

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Tests unitaires
        run: composer test
